basePath: /
definitions:
  auth.ApiResponse:
    properties:
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
  auth.ApiResponseWithData:
    properties:
      status:
        type: string
      statusCode:
        type: integer
    type: object
  auth.ErrResponse:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  auth.GoogleSignInRequest:
    properties:
      authCode:
        type: string
    required:
    - authCode
    type: object
  auth.PartnerSignInRequest:
    properties:
      password:
        type: string
      usernameOrEmail:
        maxLength: 254
        type: string
    required:
    - password
    - usernameOrEmail
    type: object
  auth.PartnerSignUpRequest:
    properties:
      email:
        maxLength: 254
        type: string
      firstName:
        maxLength: 80
        type: string
      lastName:
        maxLength: 80
        type: string
      password:
        type: string
      phoneNumber:
        type: string
      username:
        type: string
    required:
    - email
    - firstName
    - lastName
    - password
    - phoneNumber
    - username
    type: object
  auth.PartnerVerifyRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  auth.TokenResponse:
    properties:
      accessToken:
        type: string
    type: object
  auth.UserSignInRequest:
    properties:
      email:
        maxLength: 254
        type: string
    required:
    - email
    type: object
  auth.UserVerifyEmailRequest:
    properties:
      email:
        maxLength: 254
        type: string
      otp:
        type: string
    required:
    - email
    - otp
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: api.travelbook.localhost
info:
  contact:
    email: support@suphwit.dev
    name: Suphawit Watthanataetakun
    url: https://suphawit.dev/support
  description: Auth Service handles authentication and authorization for the Travelbook
    ecosystem.
  license:
    name: Creative Commons Attribution-NonCommercial-NoDerivatives 4.0
    url: https://creativecommons.org/licenses/by-nc-nd/4.0
  termsOfService: https://suphawit.dev/terms/
  title: Auth Service - Travelbook API
  version: 1.0.0
paths:
  /v1/auth/partner/sign-in:
    post:
      consumes:
      - application/json
      description: Authenticate partner and return access + refresh token
      parameters:
      - description: Partner credentials
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/auth.PartnerSignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/auth.ErrResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Sign in partner
      tags:
      - Auth
  /v1/auth/partner/sign-up:
    post:
      consumes:
      - application/json
      description: Register a new partner account
      parameters:
      - description: Partner registration payload
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/auth.PartnerSignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/auth.ErrResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Sign up partner
      tags:
      - Auth
  /v1/auth/partner/verify:
    post:
      consumes:
      - application/json
      description: Verify partner using JWT token (e.g. email verification or account
        activation)
      parameters:
      - description: Verification payload (JWT token)
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/auth.PartnerVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/auth.ErrResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Verify partner
      tags:
      - Auth
  /v1/auth/user/google:
    post:
      consumes:
      - application/json
      description: Authenticate user using Google ID token and return access + refresh
        token
      parameters:
      - description: Google Id token payload
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/auth.GoogleSignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/auth.ErrResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Sign in user with Google
      tags:
      - Auth
  /v1/auth/user/refresh:
    post:
      consumes:
      - application/json
      description: Generate a new access token using a valid refresh token (from HTTP-only
        cookie)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/auth.ErrResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Refresh user token pair
      tags:
      - Auth
  /v1/auth/user/sign-in:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access + refresh token
      parameters:
      - description: User credentials
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/auth.UserSignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/auth.ErrResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Sign in user
      tags:
      - Auth
  /v1/auth/user/sign-out:
    post:
      consumes:
      - application/json
      description: Invalidate user session and clear authentication cookies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Sign out user
      tags:
      - Auth
  /v1/auth/user/verify-email:
    post:
      consumes:
      - application/json
      description: Verify user using otp token by email verification
      parameters:
      - description: Verification payload (OTP token)
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/auth.UserVerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/auth.ErrResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Verify user email
      tags:
      - Auth
securityDefinitions:
  Bearer:
    description: Put **_ONLY_** your JWT Bearer token in textbox below
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
