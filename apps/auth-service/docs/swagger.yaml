basePath: /
definitions:
  auth.ApiResponse:
    properties:
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
  auth.ApiResponseWithData:
    properties:
      status:
        type: string
      statusCode:
        type: integer
    type: object
  auth.ErrResponse:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  auth.TokenResponse:
    properties:
      accessToken:
        type: string
    type: object
  auth.UserSignInRequest:
    properties:
      email:
        maxLength: 254
        type: string
    required:
    - email
    type: object
  auth.UserVerifyEmailRequest:
    properties:
      email:
        maxLength: 254
        type: string
      otp:
        type: string
    required:
    - email
    - otp
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: api.travelbook.localhost
info:
  contact:
    email: support@suphwit.dev
    name: Suphawit Watthanataetakun
    url: https://suphawit.dev/support
  description: Auth Service handles authentication and authorization for the Travelbook
    ecosystem.
  license:
    name: Creative Commons Attribution-NonCommercial-NoDerivatives 4.0
    url: https://creativecommons.org/licenses/by-nc-nd/4.0
  termsOfService: https://suphawit.dev/terms/
  title: Auth Service - Travelbook API
  version: 1.0.0
paths:
  /v1/auth/user/sign-in:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access + refresh token
      parameters:
      - description: User credentials
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/auth.UserSignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/auth.ErrResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Sign in user
      tags:
      - Auth
  /v1/auth/user/verify-email:
    post:
      consumes:
      - application/json
      description: Verify user using otp token by email verification
      parameters:
      - description: Verification payload (OTP token)
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/auth.UserVerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/auth.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/auth.ErrResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ApiResponse'
      summary: Verify user email
      tags:
      - Auth
securityDefinitions:
  Bearer:
    description: Put **_ONLY_** your JWT Bearer token in textbox below
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
