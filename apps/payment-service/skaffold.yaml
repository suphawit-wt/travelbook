apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: payment-service
build:
  local:
    push: false
    useBuildkit: true
    concurrency: 0
  artifacts:
    - image: tb-registry/payment-service
      context: ../..
      docker:
        dockerfile: apps/payment-service/Dockerfile.dev
      sync:
        manual:
          - src: 'apps/payment-service/**/*.go'
            dest: /app
          - src: 'pkg/**/*.go'
            dest: /app
deploy:
  helm:
    releases:
      - name: payment-service
        chartPath: ../../deploy/helm/payment-service
        valuesFiles:
          - ../../deploy/helm/payment-service/values.yaml
          - ../../deploy/helm/payment-service/values-dev.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_tb_registry_payment_service}}"
          image.tag: "{{.IMAGE_TAG_tb_registry_payment_service}}"