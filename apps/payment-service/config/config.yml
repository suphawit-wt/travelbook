app:
  name: Payment Service - Travelbook API
  description: |
    Payment Service. This service allows users to process payments securely.

    Features:
    - Payment Processing: Handle secure payment transactions for bookings.

    Authentication:
    Use Bearer Token in Authorization header.

    Example:
    Authorization: Bearer <your_token>
  version: '1.0.0'

auth:
  access_ttl: 15m
  refresh_ttl: 168h

security:
  cors:
    allowed_methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed_headers:
      - Origin
      - Content-Type
      - Authorization
      - X-Currency
    exposed_headers:
      - Content-Length
    allow_credentials: true
    max_age: 3600

email:
  sender_email: no-reply@travelbook.suphawit.dev
  sender_name: TravelBook