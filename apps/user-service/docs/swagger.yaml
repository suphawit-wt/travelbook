basePath: /
definitions:
  user.AddressResponse:
    properties:
      addressLine1:
        type: string
      city:
        type: string
      countryCode:
        type: string
      zipCode:
        type: string
    type: object
  user.ApiResponse:
    properties:
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
  user.ApiResponseWithData:
    properties:
      status:
        type: string
      statusCode:
        type: integer
    type: object
  user.AvatarResponse:
    properties:
      avatarUrl:
        type: string
    type: object
  user.ErrResponse:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  user.NavbarInfoResponse:
    properties:
      avatarUrl:
        type: string
      geniusTier:
        type: integer
    type: object
  user.PassportDetailsResponse:
    properties:
      expireDate:
        type: string
      firstName:
        type: string
      issueCountry:
        type: string
      lastName:
        type: string
      passportNumber:
        type: string
    type: object
  user.PersonalDetailsResponse:
    properties:
      dateOfBirth:
        type: string
      firstName:
        type: string
      gender:
        type: string
      lastName:
        type: string
      nationality:
        type: string
    type: object
  user.Response:
    properties:
      address:
        $ref: '#/definitions/user.AddressResponse'
      avatarUrl:
        type: string
      displayName:
        type: string
      firstName:
        type: string
      geniusTier:
        type: integer
      lastName:
        type: string
      passportDetails:
        $ref: '#/definitions/user.PassportDetailsResponse'
      personalDetails:
        $ref: '#/definitions/user.PersonalDetailsResponse'
      phoneNumber:
        type: string
    type: object
  user.UpdateDateOfBirthRequest:
    properties:
      dateOfBirth:
        type: string
    required:
    - dateOfBirth
    type: object
  user.UpdateDisplayNameRequest:
    properties:
      displayName:
        maxLength: 80
        type: string
    required:
    - displayName
    type: object
  user.UpdateGenderRequest:
    properties:
      gender:
        type: string
    required:
    - gender
    type: object
  user.UpdateNameRequest:
    properties:
      firstName:
        maxLength: 80
        type: string
      lastName:
        maxLength: 80
        type: string
    required:
    - firstName
    - lastName
    type: object
  user.UpdateNationalityRequest:
    properties:
      nationality:
        type: string
    required:
    - nationality
    type: object
  user.UpdatePhoneNumberRequest:
    properties:
      phoneNumber:
        type: string
    required:
    - phoneNumber
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: api.travelbook.localhost
info:
  contact:
    email: support@suphwit.dev
    name: Suphawit Watthanataetakun
    url: https://suphawit.dev/support
  description: User Service manages user identities, profiles, and access control
    within the TravelBook ecosystem.
  license:
    name: Creative Commons Attribution-NonCommercial-NoDerivatives 4.0
    url: https://creativecommons.org/licenses/by-nc-nd/4.0
  termsOfService: https://suphawit.dev/terms/
  title: User Service - Travelbook API
  version: 1.0.0
paths:
  /v1/users/me:
    get:
      consumes:
      - application/json
      description: Get a single user by id
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/user.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/user.Response'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ApiResponse'
      security:
      - Bearer: []
      summary: Get user by id
      tags:
      - Users
  /v1/users/me/avatar:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Upload and update the authenticated user's avatar image.
        Supported formats: jpg, jpeg, png, webp. Max size: 2MB.
      parameters:
      - description: Avatar image file (max 2MB)
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Avatar uploaded successfully
          schema:
            allOf:
            - $ref: '#/definitions/user.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/user.AvatarResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "413":
          description: File too large
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "415":
          description: Unsupported file type
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/user.ApiResponse'
      security:
      - Bearer: []
      summary: Upload user avatar
      tags:
      - Users
  /v1/users/me/date-of-birth:
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's date of birth. Date format must
        be YYYY-MM-DD.
      parameters:
      - description: UpdateDateOfBirthRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/user.UpdateDateOfBirthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/user.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/user.ErrResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ApiResponse'
      security:
      - Bearer: []
      summary: Update user date of birth
      tags:
      - Users
  /v1/users/me/display-name:
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's display name.
      parameters:
      - description: UpdateDisplayNameRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/user.UpdateDisplayNameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/user.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/user.ErrResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ApiResponse'
      security:
      - Bearer: []
      summary: Update user display name
      tags:
      - Users
  /v1/users/me/gender:
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's gender.
      parameters:
      - description: UpdateGenderRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/user.UpdateGenderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/user.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/user.ErrResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ApiResponse'
      security:
      - Bearer: []
      summary: Update user gender
      tags:
      - Users
  /v1/users/me/name:
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's name.
      parameters:
      - description: UpdateNameRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/user.UpdateNameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/user.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/user.ErrResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ApiResponse'
      security:
      - Bearer: []
      summary: Update user name
      tags:
      - Users
  /v1/users/me/nationality:
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's nationality.
      parameters:
      - description: UpdateNationalityRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/user.UpdateNationalityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/user.ApiResponse'
            - properties:
                errors:
                  items:
                    $ref: '#/definitions/user.ErrResponse'
                  type: array
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ApiResponse'
      security:
      - Bearer: []
      summary: Update user nationality
      tags:
      - Users
  /v1/users/me/phone-number:
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's phone number.
      parameters:
      - description: UpdatePhoneNumberRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/user.UpdatePhoneNumberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/user.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/user.ErrResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ApiResponse'
      security:
      - Bearer: []
      summary: Update user phone number
      tags:
      - Users
  /v1/users/navbar-info:
    get:
      consumes:
      - application/json
      description: Get a user's navbar info
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/user.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/user.NavbarInfoResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ApiResponse'
      security:
      - Bearer: []
      summary: Get user navbar info
      tags:
      - Users
securityDefinitions:
  Bearer:
    description: Put **_ONLY_** your JWT Bearer token in textbox below
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
