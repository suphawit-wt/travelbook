basePath: /
definitions:
  user.ApiResponse:
    properties:
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
  user.ApiResponseWithData:
    properties:
      status:
        type: string
      statusCode:
        type: integer
    type: object
  user.NavbarInfoResponse:
    properties:
      avatarUrl:
        type: string
      geniusTier:
        type: integer
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: api.travelbook.localhost
info:
