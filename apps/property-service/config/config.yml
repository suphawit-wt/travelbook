app:
  name: Property Service - Travelbook API
  description: |
    Property Service is a microservice that provides property search
    and filtering functionality for the Travelbook API.
    It allows users to search for properties based on various criteria.

    Features:
    - Property creation and management
    - Property search and filtering
    - Property availability

    Authentication:
    Use Bearer Token in Authorization header.

    Example:
    Authorization: Bearer <your_token>
  version: '1.0.0'

auth:
  access_ttl: 15m
  refresh_ttl: 168h

security:
  cors:
    allowed_methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed_headers:
      - Origin
      - Content-Type
      - Authorization
      - X-Currency
    exposed_headers:
      - Content-Length
    allow_credentials: true
    max_age: 3600

email:
  sender_email: no-reply@travelbook.suphawit.dev
  sender_name: TravelBook