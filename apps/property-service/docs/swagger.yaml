basePath: /
definitions:
  property.AgeRange:
    properties:
      max:
        type: integer
      min:
        type: integer
    type: object
  property.ApiResponse:
    properties:
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
  property.ApiResponseWithData:
    properties:
      status:
        type: string
      statusCode:
        type: integer
    type: object
  property.AreaInfo:
    properties:
      beaches:
        items:
          $ref: '#/definitions/property.AreaItem'
        type: array
      closestAirports:
        items:
          $ref: '#/definitions/property.AreaItem'
        type: array
      naturalBeauty:
        items:
          $ref: '#/definitions/property.AreaItem'
        type: array
      nearbyPlaces:
        items:
          $ref: '#/definitions/property.AreaItem'
        type: array
      publicTransit:
        items:
          $ref: '#/definitions/property.AreaItem'
        type: array
      restaurantsCafe:
        items:
          $ref: '#/definitions/property.AreaItem'
        type: array
      topAttractions:
        items:
          $ref: '#/definitions/property.AreaItem'
        type: array
    type: object
  property.AreaItem:
    properties:
      distanceM:
        type: number
      name:
        type: string
      type:
        $ref: '#/definitions/property.AreaType'
    type: object
  property.AreaType:
    enum:
    - cafeBar
    - peak
    - train
    - bus
    type: string
    x-enum-varnames:
    - AreaTypeCafeBar
    - AreaTypePeak
    - AreaTypeTrain
    - AreaTypeBus
  property.BedPolicy:
    properties:
      ageRange:
        $ref: '#/definitions/property.AgeRange'
      free:
        type: boolean
      price:
        $ref: '#/definitions/property.Money'
    type: object
  property.ChildPolicies:
    properties:
      allowed:
        type: boolean
      chargedAsAdultsAge:
        type: integer
      minAgeAllowed:
        type: integer
    type: object
  property.CreatePropertyImagesRequest:
    properties:
      images:
        items:
          $ref: '#/definitions/property.ImageUploadRequst'
        type: array
    required:
    - images
    type: object
  property.CreatePropertyRequest:
    properties:
      checkInFrom:
        type: string
      checkInUntil:
        type: string
      checkOutFrom:
        type: string
      checkOutUntil:
        type: string
      name:
        maxLength: 90
        type: string
      timezone:
        type: string
      type:
        $ref: '#/definitions/property.Type'
    required:
    - checkInFrom
    - checkInUntil
    - checkOutFrom
    - checkOutUntil
    - name
    - timezone
    - type
    type: object
  property.CreatePropertyResponse:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      timezone:
        type: string
      type:
        $ref: '#/definitions/property.Type'
    type: object
  property.CreatePropertyRoomRequest:
    properties:
      basePriceCents:
        minimum: 0
        type: integer
      beds:
        items:
          $ref: '#/definitions/property.bedRequest'
        type: array
      maxAdults:
        type: integer
      maxChildren:
        minimum: 0
        type: integer
      name:
        type: string
      totalRooms:
        type: integer
    required:
    - basePriceCents
    - beds
    - maxAdults
    - maxChildren
    - name
    - totalRooms
    type: object
  property.CreateRatePlanRequest:
    properties:
      breakfastIncluded:
        type: boolean
      name:
        maxLength: 20
        type: string
      priceModifier:
        type: number
      refundable:
        type: boolean
    required:
    - name
    - priceModifier
    type: object
  property.CribAndExtraBedPolicies:
    properties:
      crib:
        $ref: '#/definitions/property.BedPolicy'
      extraBed:
        $ref: '#/definitions/property.BedPolicy'
    type: object
  property.DamageDeposit:
    properties:
      price:
        type: number
      required:
        type: boolean
    type: object
  property.DetailResponse:
    properties:
      about:
        type: string
      area:
        type: string
      areaInfo:
        $ref: '#/definitions/property.AreaInfo'
      avgRating:
        type: number
      checkInFrom:
        type: string
      checkInUntil:
        type: string
      checkOutFrom:
        type: string
      checkOutUntil:
        type: string
      city:
        type: string
      countryCode:
        type: string
      facilities:
        items:
          $ref: '#/definitions/property.facilityGroup'
        type: array
      finePrint:
        type: string
      highlights:
        $ref: '#/definitions/property.Highlights'
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/property.image'
        type: array
      name:
        type: string
      reviewCount:
        type: integer
      reviews:
        items:
          $ref: '#/definitions/property.review'
        type: array
      rooms:
        items:
          $ref: '#/definitions/property.roomAvailability'
        type: array
      rules:
        $ref: '#/definitions/property.Rules'
      slug:
        type: string
      timezone:
        type: string
      type:
        $ref: '#/definitions/property.Type'
      zipCode:
        type: string
    type: object
  property.ErrResponse:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  property.FileMetadataRequest:
    properties:
      contentType:
        type: string
      fileName:
        type: string
      size:
        type: integer
    required:
    - contentType
    - fileName
    - size
    type: object
  property.GenerateImageUploadURLsRequest:
    properties:
      files:
        items:
          $ref: '#/definitions/property.FileMetadataRequest'
        type: array
    required:
    - files
    type: object
  property.GenerateImageUploadURLsResponse:
    properties:
      uploads:
        items:
          $ref: '#/definitions/property.ImageUploadURLsResponse'
        type: array
    type: object
  property.Highlights:
    properties:
      breakfastInfo:
        items:
          type: string
        type: array
      roomsWith:
        items:
          type: string
        type: array
    type: object
  property.ImageUploadRequst:
    properties:
      id:
        type: string
      imageUrl:
        type: string
      key:
        type: string
      orientation:
        type: string
      position:
        minimum: 0
        type: integer
    required:
    - id
    - imageUrl
    - key
    - orientation
    - position
    type: object
  property.ImageUploadURLsResponse:
    properties:
      id:
        type: string
      imageUrl:
        type: string
      key:
        type: string
      uploadUrl:
        type: string
    type: object
  property.Money:
    properties:
      amount:
        type: number
      currency:
        type: string
    type: object
  property.Rules:
    properties:
      acceptedPayment:
        items:
          type: string
        type: array
      childPolicies:
        $ref: '#/definitions/property.ChildPolicies'
      cribAndExtraBedPolicies:
        $ref: '#/definitions/property.CribAndExtraBedPolicies'
      damageDeposit:
        $ref: '#/definitions/property.DamageDeposit'
      minCheckInAge:
        type: integer
      partiesAllowed:
        type: boolean
      petsAllowed:
        type: boolean
    type: object
  property.SearchPropertyResponse:
    properties:
      area:
        type: string
      avgRating:
        type: number
      city:
        type: string
      countryCode:
        type: string
      id:
        type: string
      image:
        type: string
      name:
        type: string
      reviewCount:
        type: integer
      room:
        $ref: '#/definitions/property.roomResponse'
      slug:
        type: string
      startingPrice:
        type: number
    type: object
  property.Type:
    enum:
