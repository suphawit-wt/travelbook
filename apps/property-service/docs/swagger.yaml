basePath: /
definitions:
  property.ApiResponse:
    properties:
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
  property.ApiResponseWithData:
    properties:
      status:
        type: string
      statusCode:
        type: integer
    type: object
  property.CreatePropertyImagesRequest:
    properties:
      images:
        items:
          $ref: '#/definitions/property.ImageUploadRequst'
        type: array
    required:
    - images
    type: object
  property.CreatePropertyRequest:
    properties:
      checkInFrom:
        type: string
      checkInUntil:
        type: string
      checkOutFrom:
        type: string
      checkOutUntil:
        type: string
      name:
        maxLength: 90
        type: string
      timezone:
        type: string
      type:
        $ref: '#/definitions/property.Type'
    required:
    - checkInFrom
    - checkInUntil
    - checkOutFrom
    - checkOutUntil
    - name
    - timezone
    - type
    type: object
  property.CreatePropertyResponse:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      timezone:
        type: string
      type:
        $ref: '#/definitions/property.Type'
    type: object
  property.CreatePropertyRoomRequest:
    properties:
      basePriceCents:
        minimum: 0
        type: integer
      beds:
        items:
          $ref: '#/definitions/property.bedRequest'
        type: array
      maxAdults:
        type: integer
      maxChildren:
        minimum: 0
        type: integer
      name:
        type: string
      totalRooms:
        type: integer
    required:
    - basePriceCents
    - beds
    - maxAdults
    - maxChildren
    - name
    - totalRooms
    type: object
  property.CreateRatePlanRequest:
    properties:
      breakfastIncluded:
        type: boolean
      name:
        maxLength: 20
        type: string
      priceModifier:
        type: number
      refundable:
        type: boolean
    required:
    - name
    - priceModifier
    type: object
  property.ErrResponse:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  property.FileMetadataRequest:
    properties:
      contentType:
        type: string
      fileName:
        type: string
      size:
        type: integer
    required:
    - contentType
    - fileName
    - size
    type: object
  property.GenerateImageUploadURLsRequest:
    properties:
      files:
        items:
          $ref: '#/definitions/property.FileMetadataRequest'
        type: array
    required:
    - files
    type: object
  property.GenerateImageUploadURLsResponse:
    properties:
      uploads:
        items:
          $ref: '#/definitions/property.ImageUploadURLsResponse'
        type: array
    type: object
  property.ImageUploadRequst:
    properties:
      id:
        type: string
      imageUrl:
        type: string
      key:
        type: string
      orientation:
        type: string
      position:
        minimum: 0
        type: integer
    required:
    - id
    - imageUrl
    - key
    - orientation
    - position
    type: object
  property.ImageUploadURLsResponse:
    properties:
      id:
        type: string
      imageUrl:
        type: string
      key:
        type: string
      uploadUrl:
        type: string
    type: object
  property.Type:
    enum:
    - hotel
    - apartment
    - resort
    - villa
    - cabin
    type: string
    x-enum-varnames:
    - TypeHotel
    - TypeApartment
    - TypeResort
    - TypeVilla
    - TypeCabin
  property.UpdatePropertyDescriptionRequest:
    properties:
      about:
        type: string
      areaInfo:
        $ref: '#/definitions/property.areaInfoRequest'
      hilights:
        $ref: '#/definitions/property.hilightsRequest'
    required:
    - about
    - hilights
    type: object
  property.UpdatePropertyLocationRequest:
    properties:
      addressLine1:
        maxLength: 80
        type: string
      addressLine2:
        maxLength: 80
        type: string
      areaId:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      zipCode:
        type: string
    required:
    - addressLine1
    - areaId
    - latitude
    - longitude
    - zipCode
    type: object
  property.UpdatePropertyPoliciesRequest:
    properties:
      finePrint:
        type: string
      rules:
        $ref: '#/definitions/property.rulesRequest'
    required:
    - rules
    type: object
  property.ageRangeRequest:
    properties:
      max:
        type: integer
      min:
        type: integer
    required:
    - min
    type: object
  property.areaInfoRequest:
    properties:
      beaches:
        items:
          $ref: '#/definitions/property.areaItemRequest'
        type: array
      closestAirports:
        items:
          $ref: '#/definitions/property.areaItemRequest'
        type: array
      naturalBeauty:
        items:
          $ref: '#/definitions/property.areaItemRequest'
        type: array
      nearbyPlaces:
        items:
          $ref: '#/definitions/property.areaItemRequest'
        type: array
      publicTransit:
        items:
          $ref: '#/definitions/property.areaItemRequest'
        type: array
      restaurantsCafe:
        items:
          $ref: '#/definitions/property.areaItemRequest'
        type: array
      topAttractions:
        items:
          $ref: '#/definitions/property.areaItemRequest'
        type: array
    type: object
  property.areaItemRequest:
    properties:
      distanceM:
        type: number
      name:
        type: string
      type:
        $ref: '#/definitions/property.Type'
    required:
    - distanceM
    - name
    type: object
  property.bedPolicyRequest:
    properties:
      ageRange:
        $ref: '#/definitions/property.ageRangeRequest'
      free:
        type: boolean
      price:
        $ref: '#/definitions/property.moneyRequest'
    required:
    - ageRange
    type: object
  property.bedRequest:
    properties:
      bedType:
        type: string
      quantity:
        type: integer
    required:
    - bedType
    - quantity
    type: object
  property.childPoliciesRequest:
    properties:
      allowed:
        type: boolean
      chargedAsAdultsAge:
        type: integer
      minAgeAllowed:
        type: integer
    type: object
  property.cribAndExtraBedPoliciesRequest:
    properties:
      crib:
        $ref: '#/definitions/property.bedPolicyRequest'
      extraBed:
        $ref: '#/definitions/property.bedPolicyRequest'
    required:
    - crib
    - extraBed
    type: object
  property.damageDepositRequest:
    properties:
      price:
        type: number
      required:
        type: boolean
    type: object
  property.hilightsRequest:
    properties:
      breakfastInfo:
        items:
          type: string
        type: array
      roomsWith:
        items:
          type: string
        type: array
    required:
    - roomsWith
    type: object
  property.moneyRequest:
    properties:
      amount:
        type: number
      currency:
        type: string
    required:
    - amount
    - currency
    type: object
  property.rulesRequest:
    properties:
      acceptedPayment:
        items:
          type: string
        type: array
      childPolicies:
        $ref: '#/definitions/property.childPoliciesRequest'
      cribAndExtraBedPolicies:
        $ref: '#/definitions/property.cribAndExtraBedPoliciesRequest'
      damageDeposit:
        $ref: '#/definitions/property.damageDepositRequest'
      minCheckInAge:
        type: integer
      partiesAllowed:
        type: boolean
      petsAllowed:
        type: boolean
    required:
    - acceptedPayment
    - childPolicies
    - cribAndExtraBedPolicies
    - minCheckInAge
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: api.travelbook.localhost
info:
  contact:
    email: support@suphwit.dev
    name: Suphawit Watthanataetakun
    url: https://suphawit.dev/support
  description: Property Service is a microservice that provides property search and
