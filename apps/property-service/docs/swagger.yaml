      cribAndExtraBedPolicies:
        $ref: '#/definitions/property.cribAndExtraBedPoliciesRequest'
      damageDeposit:
        $ref: '#/definitions/property.damageDepositRequest'
      minCheckInAge:
        type: integer
      partiesAllowed:
        type: boolean
      petsAllowed:
        type: boolean
