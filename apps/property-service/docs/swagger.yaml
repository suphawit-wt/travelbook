  title: Property Service - Travelbook API
  version: 1.0.0
paths:
  /v1/properties:
    post:
      consumes:
      - application/json
      description: Create a new property
      parameters:
      - description: CreatePropertyRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/property.CreatePropertyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/property.CreatePropertyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/property.ErrResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/property.ApiResponse'
      security:
      - Bearer: []
      summary: Create property
      tags:
      - Properties
  /v1/properties/{id}/descripion:
    patch:
      consumes:
      - application/json
      description: Update the description of an existing property.
      parameters:
      - description: Property ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: UpdatePropertyDescriptionRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/property.UpdatePropertyDescriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/property.ErrResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/property.ApiResponse'
      security:
      - Bearer: []
      summary: Update property description
      tags:
      - Properties
  /v1/properties/{id}/images:
    post:
      consumes:
      - application/json
      description: Create a new property images.
      parameters:
      - description: Property ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: CreatePropertyImagesRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/property.CreatePropertyImagesRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/property.ErrResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/property.ApiResponse'
      security:
      - Bearer: []
      summary: Create property images
      tags:
      - Properties
  /v1/properties/{id}/images/presigned-urls:
    post:
      consumes:
      - application/json
      description: Generate presigned URLs for uploading property images to file storage.
      parameters:
      - description: Property ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: GenerateImageUploadURLsRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/property.GenerateImageUploadURLsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/property.GenerateImageUploadURLsResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/property.ErrResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/property.ApiResponse'
      security:
      - Bearer: []
      summary: Generate image upload URLs
      tags:
      - Properties
  /v1/properties/{id}/location:
    patch:
      consumes:
      - application/json
      description: Update the location details of an existing property, including
        address, city, state, postal code, and country.
      parameters:
      - description: Property ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: UpdatePropertyLocationRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/property.UpdatePropertyLocationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/property.ErrResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/property.ApiResponse'
      security:
      - Bearer: []
      summary: Update property location
      tags:
      - Properties
  /v1/properties/{id}/policies:
    patch:
      consumes:
      - application/json
      description: Update the policies of an existing property, including cancellation
        policy, house rules, and health and safety measures.
      parameters:
      - description: Property ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: UpdatePropertyPoliciesRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/property.UpdatePropertyPoliciesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/property.ErrResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/property.ApiResponse'
      security:
      - Bearer: []
      summary: Update property policies
      tags:
      - Properties
  /v1/properties/{id}/publish:
    patch:
      consumes:
      - application/json
      description: Publish an property listing
      parameters:
      - description: Property ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/property.ErrResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/property.ApiResponse'
      security:
      - Bearer: []
      summary: Publish property listing
      tags:
      - Properties
  /v1/properties/{id}/rooms:
    post:
      consumes:
      - application/json
      description: Create a new property room
      parameters:
      - description: Property ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: CreatePropertyRoomRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/property.CreatePropertyRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/property.ErrResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/property.ApiResponse'
      security:
      - Bearer: []
      summary: Create property room
      tags:
      - Properties
  /v1/properties/{id}/unpublish:
    patch:
      consumes:
      - application/json
      description: Unpublish an property listing
      parameters:
      - description: Property ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/property.ErrResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/property.ApiResponse'
      security:
      - Bearer: []
      summary: Unpublish property listing
      tags:
      - Properties
  /v1/properties/rooms/{id}/rate-plans:
    post:
      consumes:
      - application/json
      description: Creates a new rate plan for the specified room ID. Requires partner
        authentication.
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: string
      - description: CreateRatePlanRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/property.CreateRatePlanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/property.ErrResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/property.ApiResponse'
      summary: Create a new rate plan for a room
      tags:
      - Properties
securityDefinitions:
  Bearer:
    description: Put **_ONLY_** your JWT Bearer token in textbox below
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
