    - apartment
    - resort
    - villa
    - cabin
    type: string
    x-enum-varnames:
    - TypeHotel
    - TypeApartment
    - TypeResort
    - TypeVilla
    - TypeCabin
  property.UpdatePropertyDescriptionRequest:
    properties:
      about:
        type: string
      areaInfo:
        $ref: '#/definitions/property.areaInfoRequest'
      hilights:
        $ref: '#/definitions/property.hilightsRequest'
    required:
    - about
    - hilights
    type: object
  property.UpdatePropertyLocationRequest:
    properties:
      addressLine1:
        maxLength: 80
        type: string
      addressLine2:
        maxLength: 80
        type: string
      areaId:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      zipCode:
        type: string
    required:
    - addressLine1
    - areaId
    - latitude
    - longitude
    - zipCode
    type: object
  property.UpdatePropertyPoliciesRequest:
    properties:
      finePrint:
        type: string
      rules:
        $ref: '#/definitions/property.rulesRequest'
    required:
    - rules
    type: object
  property.ageRangeRequest:
    properties:
      max:
        type: integer
      min:
        type: integer
    required:
