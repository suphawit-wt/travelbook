    type: object
  property.childPoliciesRequest:
    properties:
      allowed:
        type: boolean
      chargedAsAdultsAge:
        type: integer
      minAgeAllowed:
        type: integer
    type: object
  property.cribAndExtraBedPoliciesRequest:
