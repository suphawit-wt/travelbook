paths:
  /v1/properties:
    post:
      consumes:
      - application/json
      description: Create a new property
      parameters:
      - description: CreatePropertyRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/property.CreatePropertyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponseWithData'
            - properties:
                data:
                  $ref: '#/definitions/property.CreatePropertyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/property.ErrResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/property.ApiResponse'
      security:
      - Bearer: []
      summary: Create property
      tags:
      - Properties
  /v1/properties/{id}/descripion:
    patch:
      consumes:
      - application/json
      description: Update the description of an existing property.
      parameters:
      - description: Property ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: UpdatePropertyDescriptionRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/property.UpdatePropertyDescriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/property.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/property.ErrResponse'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/property.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/property.ApiResponse'
      security:
      - Bearer: []
      summary: Update property description
      tags:
      - Properties
  /v1/properties/{id}/images:
