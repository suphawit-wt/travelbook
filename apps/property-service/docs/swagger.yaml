    type: object
  property.areaInfoRequest:
    properties:
      beaches:
        items:
          $ref: '#/definitions/property.areaItemRequest'
        type: array
      closestAirports:
        items:
          $ref: '#/definitions/property.areaItemRequest'
        type: array
      naturalBeauty:
        items:
          $ref: '#/definitions/property.areaItemRequest'
        type: array
      nearbyPlaces:
        items:
          $ref: '#/definitions/property.areaItemRequest'
        type: array
      publicTransit:
        items:
          $ref: '#/definitions/property.areaItemRequest'
        type: array
      restaurantsCafe:
        items:
          $ref: '#/definitions/property.areaItemRequest'
        type: array
      topAttractions:
        items:
          $ref: '#/definitions/property.areaItemRequest'
