    required:
    - crib
    - extraBed
    type: object
  property.damageDepositRequest:
    properties:
      price:
        type: number
      required:
        type: boolean
    type: object
  property.facilityGroup:
    properties:
      category:
        type: string
      items:
        items:
          type: string
        type: array
    type: object
  property.hilightsRequest:
    properties:
      breakfastInfo:
        items:
          type: string
        type: array
      roomsWith:
        items:
          type: string
        type: array
    required:
    - roomsWith
    type: object
  property.image:
    properties:
      id:
        type: string
      orientation:
        type: string
      position:
        type: integer
      url:
        type: string
    type: object
  property.moneyRequest:
    properties:
      amount:
        type: number
      currency:
        type: string
    required:
    - amount
    - currency
    type: object
  property.ratePlan:
    properties:
      breakfastIncluded:
        type: boolean
      id:
        type: string
      maxGuest:
        type: integer
      name:
        type: string
      price:
        type: number
      refundable:
        type: boolean
    type: object
  property.review:
    properties:
      comment:
        type: string
      countryCode:
        type: string
      displayName:
        type: string
      id:
        type: string
    type: object
  property.roomAvailability:
    properties:
      availableRooms:
        type: integer
      bedInfo:
        type: string
      facilities:
        items:
          type: string
        type: array
      name:
        type: string
      ratePlans:
        items:
          $ref: '#/definitions/property.ratePlan'
        type: array
      roomId:
        type: string
    type: object
  property.roomResponse:
    properties:
      beds:
        items:
          $ref: '#/definitions/property.bedsResponse'
        type: array
      breakfastIncluded:
        type: boolean
      name:
        type: string
    type: object
  property.rulesRequest:
    properties:
      acceptedPayment:
        items:
