basePath: /
definitions:
  review.ApiResponse:
    properties:
      message:
        type: string
      status:
        type: string
      statusCode:
        type: integer
    type: object
  review.ApiResponseWithData:
    properties:
      status:
        type: string
      statusCode:
        type: integer
    type: object
  review.CreateReviewRequest:
    properties:
      bookingId:
        type: string
      comment:
        maxLength: 500
        type: string
      propertyId:
        type: string
      rating:
        maximum: 10
        minimum: 1
        type: integer
      subRatings:
        $ref: '#/definitions/review.SubRatings'
    required:
    - bookingId
    - propertyId
    - rating
    type: object
  review.ErrResponse:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  review.Response:
    properties:
      bookingId:
        type: string
      comment:
        type: string
      createdAt:
        type: string
      id:
        type: string
      propertyId:
        type: string
      rating:
        type: integer
      subRatings:
        $ref: '#/definitions/review.SubRatings'
      updatedAt:
        type: string
      userCountryCode:
        type: string
      userDisplayName:
        type: string
      userId:
        type: string
    type: object
  review.SubRatings:
    properties:
      cleanliness:
        maximum: 10
        minimum: 1
        type: integer
      comfort:
        maximum: 10
        minimum: 1
        type: integer
      facilities:
        maximum: 10
        minimum: 1
        type: integer
      location:
        maximum: 10
        minimum: 1
        type: integer
      staff:
        maximum: 10
        minimum: 1
        type: integer
      value:
        maximum: 10
        minimum: 1
        type: integer
      wifi:
        maximum: 10
        minimum: 1
        type: integer
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: api.travelbook.localhost
info:
  contact:
    email: support@suphwit.dev
    name: Suphawit Watthanataetakun
    url: https://suphawit.dev/support
  description: Review Service manages property reviews, ratings, and user feedback
    within the TravelBook ecosystem.
  license:
    name: Creative Commons Attribution-NonCommercial-NoDerivatives 4.0
    url: https://creativecommons.org/licenses/by-nc-nd/4.0
  termsOfService: https://suphawit.dev/terms/
  title: Review Service - Travelbook API
  version: 1.0.0
paths:
  /v1/reviews:
    post:
      consumes:
      - application/json
      description: Create review by user
      parameters:
      - description: CreateReviewRequest
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/review.CreateReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/review.ApiResponse'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/review.ApiResponse'
            - properties:
                errors:
                  $ref: '#/definitions/review.ErrResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/review.ApiResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/review.ApiResponse'
      security:
      - Bearer: []
      summary: Create review by user
      tags:
      - Reviews
  /v1/reviews/properties/{id}:
    get:
      consumes:
      - application/json
      description: Get reviews associated with a specific property
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/review.ApiResponseWithData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/review.Response'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/review.ApiResponse'
      security:
      - Bearer: []
      summary: Get reviews by property ID
      tags:
      - Reviews
securityDefinitions:
  Bearer:
    description: Put **_ONLY_** your JWT Bearer token in textbox below
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
