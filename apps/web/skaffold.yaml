apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: web
build:
  local:
    push: false
    useBuildkit: true
    concurrency: 0
  artifacts:
    - image: tb-registry/web
      context: .
      docker:
        dockerfile: Dockerfile.dev
      sync:
        manual:
          - src: 'src/**/*'
            dest: /app
          - src: 'public/**/*'
            dest: /app
          - src: 'next.config.mjs'
            dest: /app/next.config.mjs
deploy:
  helm:
    releases:
      - name: web
        chartPath: ../../deploy/helm/web
        valuesFiles:
          - ../../deploy/helm/web/values.yaml
          - ../../deploy/helm/web/values-dev.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_tb_registry_web}}"
          image.tag: "{{.IMAGE_TAG_tb_registry_web}}"