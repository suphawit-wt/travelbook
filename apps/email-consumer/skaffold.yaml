apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: email-consumer
build:
  local:
    push: false
    useBuildkit: true
    concurrency: 0
  artifacts:
    - image: tb-registry/email-consumer
      context: ../..
      docker:
        dockerfile: apps/email-consumer/Dockerfile.dev
      sync:
        manual:
          - src: 'apps/email-consumer/**/*.go'
            dest: /app
          - src: 'pkg/**/*.go'
            dest: /app
deploy:
  helm:
    releases:
      - name: email-consumer
        chartPath: ../../deploy/helm/email-consumer
        valuesFiles:
          - ../../deploy/helm/email-consumer/values.yaml
          - ../../deploy/helm/email-consumer/values-dev.yaml
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_tb_registry_email_consumer}}"
          image.tag: "{{.IMAGE_TAG_tb_registry_email_consumer}}"