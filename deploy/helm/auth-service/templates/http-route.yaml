apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-service-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: travelbook-gateway
    namespace: {{ .Values.namespace }}
  hostnames:
  - {{ .Values.hostnames }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/auth
    - path:
        type: PathPrefix
        value: /v2/auth
    backendRefs:
    - name: auth-service
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /v1/auth/internal
    - path:
        type: PathPrefix
        value: /v2/auth/internal