apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payment-service-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: travelbook-gateway
    namespace: {{ .Values.namespace }}
  hostnames:
  - {{ .Values.hostnames }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/payments
    - path:
        type: PathPrefix
        value: /v2/payments
    backendRefs:
    - name: payment-service
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /v1/payments/internal
    - path:
        type: PathPrefix
        value: /v2/payments/internal