{{- if .Values.tls.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tls.secretName }}
  namespace: {{ .Values.namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Files.Get "certs/travelbook.localhost.pem" | b64enc }}
  tls.key: {{ .Files.Get "certs/travelbook.localhost-key.pem" | b64enc }}
{{- end }}