apiVersion: v1
kind: ServiceAccount
metadata:
  name: travelbook-api-sa
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: travelbook-api-sa-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: travelbook-api-sa
  namespace: {{ .Values.namespace }}