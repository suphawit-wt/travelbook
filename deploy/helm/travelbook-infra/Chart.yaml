apiVersion: v2
name: travelbook-infra
description: Umbrella Chart for Travelbook Platform Infrastructure
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: vault
    version: 0.1.0
    repository: "file://charts/vault"
    condition: vault.enabled
  - name: postgres
    version: 0.1.0
    repository: "file://charts/postgres"
    condition: postgres.enabled
  - name: redis
    version: 0.1.0
    repository: "file://charts/redis"
    condition: redis.enabled
  - name: cassandra
    version: 0.1.0
    repository: "file://charts/cassandra"
    condition: cassandra.enabled
  - name: kafka
    version: 0.1.0
    repository: "file://charts/kafka"
    condition: kafka.enabled
  - name: elasticsearch
    version: 0.1.0
    repository: "file://charts/elasticsearch"
    condition: elasticsearch.enabled
  - name: debezium
    version: 0.1.0
    repository: "file://charts/debezium"
    condition: debezium.enabled
  - name: kibana
    version: 0.1.0
    repository: "file://charts/kibana"
    condition: kibana.enabled
  - name: kafbat
    version: 0.1.0
    repository: "file://charts/kafbat"
    condition: kafbat.enabled