apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
      - name: cassandra
        image: cassandra:5.0
        env:
        - name: CASSANDRA_CLUSTER_NAME
          value: "TravelbookCluster"
        - name: CASSANDRA_DC
          value: "dc1"
        - name: CASSANDRA_RACK
          value: "rack1"
        - name: CASSANDRA_USER
          value: "tb_cas_user"
        - name: CASSANDRA_PASSWORD
          value: "csPass?789123"
        - name: CASSANDRA_AUTHENTICATOR
          value: "PasswordAuthenticator"
        - name: CASSANDRA_AUTHORIZER
          value: "CassandraAuthorizer"
        - name: CASSANDRA_ENDPOINT_SNITCH
          value: "GossipingPropertyFileSnitch"
        - name: MAX_HEAP_SIZE
          value: "512M"
        - name: HEAP_NEWSIZE
          value: "128M"
        resources:
          requests:
            cpu: "850m"
            memory: "768Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        volumeMounts:
        - name: cassandra-data
          mountPath: /var/lib/cassandra
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - cqlsh -u tb_cas_user -p 'csPass?789123' -e 'DESCRIBE KEYSPACES' || exit 1
          initialDelaySeconds: 40
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - cqlsh -u tb_cas_user -p 'csPass?789123' -e 'DESCRIBE KEYSPACES' || exit 1
          initialDelaySeconds: 40
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 10
      volumes:
      - name: cassandra-data
        persistentVolumeClaim:
          claimName: tb-cassandra-pvc