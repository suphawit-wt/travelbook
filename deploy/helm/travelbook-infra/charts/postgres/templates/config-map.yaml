apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: {{ .Values.namespace }}
data:
  {{- (.Files.Glob "sql/*").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: {{ .Values.namespace }}
data:
  postgresql.conf: |
    listen_addresses = '*'

    # Replication Settings (Debezium CDC)
    wal_level = logical
    max_replication_slots = 10
    max_wal_senders = 10
    max_slot_wal_keep_size = 50GB

    # Preload Extensions
    shared_preload_libraries = 'pg_cron'

    # pg_cron Target DB
    cron.database_name = 'tb_auth_db'
    cron.username = 'pguser'