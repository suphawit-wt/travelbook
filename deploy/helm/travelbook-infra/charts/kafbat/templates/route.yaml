apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafbat-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: travelbook-gateway
  hostnames:
  - "kafbat.travelbook.localhost"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kafbat-ui
      port: 8080