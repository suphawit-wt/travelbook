apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: travelbook-gateway
    namespace: {{ .Values.namespace }}
  hostnames:
  - {{ .Values.hostnames }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: web
      port: 8080
    timeouts:
      request: 0s
      backendRequest: 0s