apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-service-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: travelbook-gateway
    namespace: {{ .Values.namespace }}
  hostnames:
  - {{ .Values.hostnames }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/users
    - path:
        type: PathPrefix
        value: /v2/users
    backendRefs:
    - name: user-service
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /v1/users/internal
    - path:
        type: PathPrefix
        value: /v2/users/internal