apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: booking-service-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: travelbook-gateway
    namespace: {{ .Values.namespace }}
  hostnames:
  - {{ .Values.hostnames }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/bookings
    - path:
        type: PathPrefix
        value: /v2/bookings
    backendRefs:
    - name: booking-service
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /v1/bookings/internal
    - path:
        type: PathPrefix
        value: /v2/bookings/internal