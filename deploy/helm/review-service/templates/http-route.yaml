apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: review-service-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: travelbook-gateway
    namespace: {{ .Values.namespace }}
  hostnames:
  - {{ .Values.hostnames }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/reviews
    - path:
        type: PathPrefix
        value: /v2/reviews
    backendRefs:
    - name: review-service
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /v1/reviews/internal
    - path:
        type: PathPrefix
        value: /v2/reviews/internal